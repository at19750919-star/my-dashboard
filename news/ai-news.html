<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工具日報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FAF7F2; --bg-card:#fff;
  --bg-claude:#FFF8F0; --bg-openai:#F0FDF9; --bg-gemini:#EFF6FF; --bg-grok:#F5F5F5;
  --t1:#1a1a1a; --t2:#555; --t3:#999; --border:#e5e0d8; --border-lt:#f0ece4;
  --claude:#C2410C; --openai:#059669; --gemini:#2563EB; --grok:#374151;
  --news:#0F766E; --hf:#92400E; --gh:#4338CA;
  --tag-claude:#C2410C; --tag-openai:#059669; --tag-gemini:#2563EB; --tag-grok:#374151;
  --tag-tool:#0D9488; --tag-model:#7C3AED; --tag-tutorial:#B45309;
  --tag-agent:#DB2777; --tag-integration:#6D28D9; --tag-open:#059669;
  --serif:'Noto Serif TC','Source Serif 4',Georgia,serif;
  --sans:'Noto Sans TC','Inter',-apple-system,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.header{max-width:820px;margin:0 auto;padding:32px 24px 16px;text-align:center;border-bottom:2px solid var(--t1)}
.header h1{font-family:var(--serif);font-size:1.8rem;font-weight:900;letter-spacing:.08em;margin-bottom:4px}
.header .sub{font-size:.82rem;color:var(--t3);letter-spacing:.05em}
.header .date-display{font-family:var(--serif);font-size:.95rem;color:var(--t2);margin-top:6px}

.date-nav{max-width:820px;margin:0 auto;display:flex;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 24px;gap:2px}
.date-tab{padding:12px 14px;font-size:.82rem;color:var(--t3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s;text-align:center}
.date-tab:hover{color:var(--t2)}
.date-tab.active{color:var(--t1);font-weight:700;border-bottom-color:var(--t1)}
.date-tab .tab-weekday{font-size:.72rem;display:block;color:var(--t3)}
.date-tab.active .tab-weekday{color:var(--t2)}

.stats-strip{max-width:820px;margin:0 auto;display:flex;justify-content:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.stat-item{font-size:.78rem;color:var(--t3);display:flex;align-items:center;gap:4px}
.stat-num{font-weight:700;color:var(--t1);font-family:var(--mono)}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.filter-bar{max-width:820px;margin:0 auto;display:flex;gap:6px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;justify-content:center}
.fbtn{padding:4px 14px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;font-size:.78rem;font-family:var(--sans);font-weight:500;letter-spacing:.03em;transition:all .15s}
.fbtn:hover{border-color:var(--t2);color:var(--t1)}
.fbtn.active{background:var(--t1);color:#fff;border-color:var(--t1)}

.container{max-width:820px;margin:0 auto;padding:0 24px 40px}
.day-block{margin-top:8px}
.day-header{display:flex;align-items:center;gap:10px;padding:16px 0 8px;cursor:pointer;user-select:none}
.day-header h3{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--t1)}
.day-header .day-toggle{font-size:.65rem;color:var(--t3);transition:transform .2s}
.day-header .day-toggle.collapsed{transform:rotate(-90deg)}
.day-content.hidden{display:none}

.section{margin-top:20px}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.sec-hdr h2{font-family:var(--serif);font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-cnt{font-family:var(--sans);font-size:.72rem;font-weight:500;color:var(--t3);background:var(--border-lt);border-radius:3px;padding:1px 7px}
.sec-toggle{font-size:.6rem;color:var(--t3);transition:transform .2s}
.sec-toggle.collapsed{transform:rotate(-90deg)}
.sec-body.hidden{display:none}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:14px 16px;margin-top:10px;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-t{font-family:var(--serif);font-weight:700;font-size:1rem;line-height:1.5;margin-bottom:5px}
.card-t a{border-bottom:1px solid transparent;transition:border-color .15s}.card-t a:hover{border-bottom-color:var(--t2)}
.card-d{font-size:.88rem;color:var(--t2);line-height:1.7;margin-bottom:8px}
.card-m{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.card-source{font-size:.7rem;color:var(--t3);margin-left:auto;font-style:italic}
.tag{display:inline-block;padding:1px 7px;border-radius:2px;font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tag-claude{background:#FFF7ED;color:var(--tag-claude)}
.tag-openai{background:#F0FDF4;color:var(--tag-openai)}
.tag-gemini{background:#EFF6FF;color:var(--tag-gemini)}
.tag-grok{background:#F3F4F6;color:var(--tag-grok)}
.tag-tool{background:#F0FDFA;color:var(--tag-tool)}
.tag-model{background:#F5F3FF;color:var(--tag-model)}
.tag-tutorial{background:#FFFBEB;color:var(--tag-tutorial)}
.tag-agent{background:#FDF2F8;color:var(--tag-agent)}
.tag-integration{background:#F5F3FF;color:var(--tag-integration)}
.tag-open{background:#ECFDF5;color:var(--tag-open)}

.sub-label{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin:16px 0 2px;padding-left:2px}

.sec-claude .card{background:var(--bg-claude);border-color:#FDBA74;border-left:3px solid var(--claude)}
.sec-openai .card{background:var(--bg-openai);border-color:#A7F3D0;border-left:3px solid var(--openai)}
.sec-gemini .card{background:var(--bg-gemini);border-color:#BFDBFE;border-left:3px solid var(--gemini)}
.sec-grok .card{background:var(--bg-grok);border-color:#D1D5DB;border-left:3px solid var(--grok)}

.gh-stats{display:flex;gap:12px;font-size:.78rem;color:var(--t3);margin-bottom:6px}
.gh-stats span{display:flex;align-items:center;gap:3px}

.footer{max-width:820px;margin:0 auto;padding:24px;text-align:center;font-size:.78rem;color:var(--t3);border-top:1px solid var(--border)}

.empty-section{text-align:center;padding:20px;color:var(--t3);font-size:.85rem;font-style:italic}

@media(max-width:600px){
  .header h1{font-size:1.4rem}
  .stats-strip{gap:10px;padding:10px 16px}
  .container{padding:0 16px 32px}
  .filter-bar{padding:10px 16px;gap:4px}
  .fbtn{padding:3px 10px;font-size:.72rem}
  .date-tab{padding:10px 6px;font-size:.75rem}
}
</style>
</head>
<body>

<header class="header">
  <h1>AI 工具日報</h1>
  <div class="sub">Claude · ChatGPT · Gemini · Grok — 每日動態追蹤</div>
  <div class="date-display" id="headerDate"></div>
</header>

<nav class="date-nav" id="dateNav"></nav>
<div class="stats-strip" id="statsStrip"></div>

<div class="filter-bar" id="filterBar">
  <button class="fbtn active" data-f="all">全部</button>
  <button class="fbtn" data-f="claude">Claude</button>
  <button class="fbtn" data-f="openai">ChatGPT</button>
  <button class="fbtn" data-f="gemini">Gemini</button>
  <button class="fbtn" data-f="grok">Grok</button>
  <button class="fbtn" data-f="model">模型</button>
  <button class="fbtn" data-f="tool">工具</button>
  <button class="fbtn" data-f="tutorial">教學</button>
  <button class="fbtn" data-f="agent">Agent</button>
  <button class="fbtn" data-f="open">開源</button>
</div>

<main class="container" id="main"></main>

<footer class="footer">AI 工具日報 — 四大平台動態 + 開源趨勢，每日自動更新 · Powered by Claude</footer>

<script src="ai-news-data.js"></script>
<script>
const SUB_LABELS = {
  model:'\u{1F195} 新模型', product:'\u{1F525} 新功能', tool:'\u{1F6E0}️ 工具更新',
  tutorial:'\u{1F4DA} 教學資源', integration:'\u{1F517} 重要整合', agent:'\u{1F916} Agent 進展',
  secondary:'\u{1F4F0} 綜合'
};
const TAG_MAP = {
  claude:'Claude', openai:'ChatGPT', gemini:'Gemini', grok:'Grok',
  tool:'工具', model:'模型', tutorial:'教學', agent:'Agent',
  integration:'整合', open:'開源'
};
const PLATFORM_LABELS = {
  claude: { icon:'\u{1F7E0}', name:'Claude / Anthropic', cls:'sec-claude' },
  openai: { icon:'\u{1F7E2}', name:'ChatGPT / OpenAI', cls:'sec-openai' },
  gemini: { icon:'\u{1F535}', name:'Gemini / Google AI', cls:'sec-gemini' },
  grok:   { icon:'⚫', name:'Grok / xAI', cls:'sec-grok' }
};
let activeFilter = 'all';

function tag(t){ return `<span class="tag tag-${t}">${TAG_MAP[t]||t}</span>` }
function tags(arr){ return (arr||[]).map(tag).join('') }

function cardHTML(item, extraBottom=''){
  const hidden = activeFilter!=='all' && !(item.tags||[]).includes(activeFilter);
  const src = item.source ? `<span class="card-source">${item.source}</span>` : '';
  return `<div class="card" data-tags="${(item.tags||[]).join(' ')}" style="${hidden?'display:none':''}">
    <div class="card-t"><a href="${item.url}" target="_blank" rel="noopener">${item.title||item.name}</a></div>
    <div class="card-d">${item.desc}</div>
    ${extraBottom}
    <div class="card-m">${tags(item.tags||[])}${src}</div>
  </div>`;
}

function renderPlatformSection(day, key){
  const items = day[key] || [];
  if(items.length === 0) return '';
  const info = PLATFORM_LABELS[key];
  const bySub = {};
  items.forEach(c => { (bySub[c.sub] = bySub[c.sub]||[]).push(c); });

  let html = `<div class="section ${info.cls}">
    <div class="sec-hdr" onclick="toggleSec(this)">
      <h2>${info.icon} ${info.name} <span class="sec-cnt">${items.length}</span></h2>
      <span class="sec-toggle">&#9662;</span>
    </div>
    <div class="sec-body">`;
  for(const sub of ['model','product','tool','tutorial','integration','agent']){
    if(!bySub[sub]) continue;
    html += `<div class="sub-label">${SUB_LABELS[sub]}</div>`;
    bySub[sub].forEach(c => { html += cardHTML(c); });
  }
  html += `</div></div>`;
  return html;
}

function renderDay(day, idx){
  const isToday = idx === 0;
  const s = day.stats;
  const total = (s.claude||0)+(s.openai||0)+(s.gemini||0)+(s.grok||0)+(s.news||0);

  let html = `<div class="day-block" data-day-idx="${idx}">`;

  if(AI_NEWS_DATA.length > 1){
    html += `<div class="day-header" onclick="toggleDay(this)">
      <span class="day-toggle${isToday?'':' collapsed'}">&#9662;</span>
      <h3>${day.date}（${day.weekday}）</h3>
      <span style="font-size:.78rem;color:var(--t3)">${total} 項</span>
    </div>
    <div class="day-content${isToday?'':' hidden'}">`;
  }

  for(const key of ['claude','openai','gemini','grok']){
    html += renderPlatformSection(day, key);
  }

  if((day.news||[]).length > 0){
    html += `<div class="section sec-news">
      <div class="sec-hdr" onclick="toggleSec(this)">
        <h2>\u{1F4F0} 其他 AI 新聞 <span class="sec-cnt">${s.news||day.news.length}</span></h2>
        <span class="sec-toggle">&#9662;</span>
      </div>
      <div class="sec-body">`;
    (day.news||[]).forEach(n => { html += cardHTML(n); });
    html += `</div></div>`;
  }

  if((day.hf||[]).length > 0){
    html += `<div class="section sec-hf">
      <div class="sec-hdr" onclick="toggleSec(this)">
        <h2>\u{1F917} HuggingFace 熱門 <span class="sec-cnt">${day.hf.length}</span></h2>
        <span class="sec-toggle">&#9662;</span>
      </div>
      <div class="sec-body">`;
    (day.hf||[]).forEach(h => {
      const meta = h.author ? `<div class="gh-stats"><span>${h.author}</span></div>` : '';
      html += cardHTML(h, meta);
    });
    html += `</div></div>`;
  }

  if((day.gh||[]).length > 0){
    html += `<div class="section sec-gh">
      <div class="sec-hdr" onclick="toggleSec(this)">
        <h2>\u{1F419} GitHub 熱門 <span class="sec-cnt">${day.gh.length}</span></h2>
        <span class="sec-toggle">&#9662;</span>
      </div>
      <div class="sec-body">`;
    (day.gh||[]).forEach(g => {
      const meta = `<div class="gh-stats">${g.stars?`<span>⭐ ${g.stars}</span>`:''}${g.lang?`<span>${g.lang}</span>`:''}</div>`;
      html += cardHTML(g, meta);
    });
    html += `</div></div>`;
  }

  if(AI_NEWS_DATA.length > 1) html += `</div>`;
  html += `</div>`;
  return html;
}

function renderAll(){
  if(!AI_NEWS_DATA || AI_NEWS_DATA.length === 0){
    document.getElementById('main').innerHTML = '<div class="empty-section">尚無新聞資料</div>';
    return;
  }
  const latest = AI_NEWS_DATA[0];
  const [y,m,d] = latest.date.split('-');
  document.getElementById('headerDate').textContent = `${y} 年 ${parseInt(m)} 月 ${parseInt(d)} 日，${latest.weekday}`;

  let navHTML = '';
  AI_NEWS_DATA.forEach((day, i) => {
    const [,mm,dd] = day.date.split('-');
    navHTML += `<div class="date-tab${i===0?' active':''}" data-idx="${i}" onclick="scrollToDay(${i})">
      ${parseInt(mm)}/${parseInt(dd)}
      <span class="tab-weekday">${day.weekday}</span>
    </div>`;
  });
  document.getElementById('dateNav').innerHTML = navHTML;
  updateStats(latest);

  let mainHTML = '';
  AI_NEWS_DATA.forEach((day, i) => { mainHTML += renderDay(day, i); });
  document.getElementById('main').innerHTML = mainHTML;
}

function updateStats(day){
  const s = day.stats;
  const total = (s.claude||0)+(s.openai||0)+(s.gemini||0)+(s.grok||0)+(s.news||0);
  document.getElementById('statsStrip').innerHTML =
    `<div class="stat-item"><span class="stat-dot" style="background:var(--claude)"></span>Claude <span class="stat-num">${s.claude||0}</span></div>
     <div class="stat-item"><span class="stat-dot" style="background:var(--openai)"></span>ChatGPT <span class="stat-num">${s.openai||0}</span></div>
     <div class="stat-item"><span class="stat-dot" style="background:var(--gemini)"></span>Gemini <span class="stat-num">${s.gemini||0}</span></div>
     <div class="stat-item"><span class="stat-dot" style="background:var(--grok)"></span>Grok <span class="stat-num">${s.grok||0}</span></div>
     <div class="stat-item">其他 <span class="stat-num">${s.news||0}</span></div>
     <div class="stat-item" style="font-weight:600;color:var(--t1)">合計 <span class="stat-num">${total}</span></div>`;
}

function scrollToDay(idx){
  document.querySelectorAll('.date-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  updateStats(AI_NEWS_DATA[idx]);
  const block = document.querySelector(`.day-block[data-day-idx="${idx}"]`);
  if(block){
    const content = block.querySelector('.day-content');
    const toggle = block.querySelector('.day-toggle');
    if(content && content.classList.contains('hidden')){
      content.classList.remove('hidden');
      if(toggle) toggle.classList.remove('collapsed');
    }
    block.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function toggleDay(header){
  const content = header.nextElementSibling;
  const toggle = header.querySelector('.day-toggle');
  if(content){ content.classList.toggle('hidden'); }
  if(toggle){ toggle.classList.toggle('collapsed'); }
}

function toggleSec(hdr){
  const body = hdr.nextElementSibling;
  const toggle = hdr.querySelector('.sec-toggle');
  if(body){ body.classList.toggle('hidden'); }
  if(toggle){ toggle.classList.toggle('collapsed'); }
}

document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('.fbtn');
  if(!btn) return;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.f;
  document.querySelectorAll('.card').forEach(card => {
    if(activeFilter === 'all'){ card.style.display = ''; return; }
    const t = card.dataset.tags || '';
    card.style.display = t.split(' ').includes(activeFilter) ? '' : 'none';
  });
});

renderAll();
</script>
</body>
</html>
